<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>STUDIO PARS - Randevu Sistemi</title>

<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eeeeee;
    color: #111111;
}


/* =====================================================
   RENKLER
===================================================== */

:root {
    --black: #080808;
    --black2: #111111;
    --black3: #1c1c1c;

    --yellow: #ffe500;
    --yellow2: #ffed45;

    --white: #ffffff;
    --gray: #777777;
    --light-gray: #eeeeee;

    --green: #22c55e;
    --orange: #f59e0b;
    --blue: #3b82f6;
    --red: #ef4444;
}


/* =====================================================
   HEADER
===================================================== */

header {
    width: 100%;
    background: var(--black);
    border-bottom: 4px solid var(--yellow);
}

.header-inner {
    width: 100%;
    max-width: 1450px;
    min-height: 125px;

    margin: 0 auto;
    padding: 18px 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;
}

.logo {
    display: block;

    width: 310px;
    max-width: 65vw;

    height: auto;
}

.clock-box {
    text-align: right;
}

.clock {
    color: var(--yellow);

    font-size: 25px;
    font-weight: 900;

    letter-spacing: 1px;
}

.date-clock {
    margin-top: 5px;

    color: white;

    font-size: 14px;
}

.timezone {
    margin-top: 5px;

    color: #888888;

    font-size: 12px;
}


/* =====================================================
   ANA CONTAINER
===================================================== */

.container {
    width: 100%;
    max-width: 1450px;

    margin: 25px auto;

    padding: 0 20px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    width: 100%;

    background: white;

    border-radius: 14px;

    padding: 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

.date-area {
    display: flex;
    align-items: center;

    gap: 7px;
}

.date-area input {
    width: 180px;
}

button {
    border: none;
    cursor: pointer;

    font-family: inherit;
    font-weight: 800;

    border-radius: 8px;

    transition: .15s;
}

.btn-yellow {
    background: var(--yellow);
    color: #000;

    padding: 12px 18px;
}

.btn-yellow:hover {
    background: var(--yellow2);
}

.btn-black {
    background: var(--black);
    color: white;

    padding: 12px 18px;
}

.day-button {
    width: 43px;
    height: 43px;

    padding: 0;

    background: var(--black);
    color: var(--yellow);

    font-size: 23px;
}


/* =====================================================
   INPUTLAR
===================================================== */

input,
select,
textarea {
    width: 100%;

    border: 1px solid #d2d2d2;

    background: white;

    border-radius: 8px;

    padding: 11px 12px;

    font-family: inherit;
    font-size: 14px;

    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--yellow);

    box-shadow:
        0 0 0 2px rgba(255,229,0,.18);
}


/* =====================================================
   İSTATİSTİKLER
===================================================== */

.stats {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin: 20px 0;
}

.stat {
    position: relative;

    background: white;

    border-radius: 13px;

    padding: 18px;

    overflow: hidden;

    box-shadow:
        0 3px 14px rgba(0,0,0,.06);
}

.stat::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;
    left: 0;

    width: 5px;

    background: var(--yellow);
}

.stat-title {
    color: #777777;

    font-size: 12px;
    font-weight: 800;
}

.stat-value {
    margin-top: 5px;

    color: #111111;

    font-size: 29px;
    font-weight: 900;
}


/* =====================================================
   MASAÜSTÜ TABLO
===================================================== */

.table-wrapper {
    width: 100%;

    background: white;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}

thead {
    background: var(--black);

    color: white;
}

th {
    padding: 16px;

    text-align: left;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: .4px;
}

th:first-child {
    color: var(--yellow);
}

th:nth-child(1) {
    width: 12%;
}

th:nth-child(2) {
    width: 23%;
}

th:nth-child(3) {
    width: 15%;
}

th:nth-child(4) {
    width: 17%;
}

th:nth-child(5) {
    width: 20%;
}

th:nth-child(6) {
    width: 13%;
}

td {
    padding: 15px;

    border-bottom: 1px solid #eeeeee;

    vertical-align: middle;

    font-size: 14px;

    overflow-wrap: break-word;
}

tbody tr:hover td {
    background: #fffde0;
}


/* =====================================================
   TABLO İÇERİĞİ
===================================================== */

.time {
    color: #111111;

    font-size: 20px;
    font-weight: 900;
}

.company-name {
    font-size: 15px;
    font-weight: 900;
}

.brand {
    display: inline-block;

    padding: 6px 9px;

    background: #f0f0f0;

    border-radius: 6px;

    font-size: 12px;
    font-weight: 800;
}

.status {
    display: inline-flex;
    align-items: center;

    padding: 7px 10px;

    border-radius: 30px;

    font-size: 11px;
    font-weight: 900;

    white-space: nowrap;
}

.waiting {
    background: #dcfce7;
    color: #166534;
}

.progress {
    background: #fef3c7;
    color: #92400e;
}

.completed {
    background: #dbeafe;
    color: #1e40af;
}

.cancelled {
    background: #fee2e2;
    color: #991b1b;
}

.actions {
    display: flex;

    gap: 6px;
}

.btn-edit {
    background: #eeeeee;

    padding: 8px 10px;
}

.btn-delete {
    background: #fee2e2;

    color: #b91c1c;

    padding: 8px 10px;
}

.next-appointment td {
    background: #fffbd0 !important;

    border-top: 2px solid var(--yellow);
    border-bottom: 2px solid var(--yellow);
}

.next-badge {
    display: inline-block;

    margin-top: 4px;

    background: var(--yellow);
    color: #000;

    padding: 3px 6px;

    border-radius: 5px;

    font-size: 9px;
    font-weight: 900;
}


/* =====================================================
   BOŞ LİSTE
===================================================== */

.empty {
    text-align: center;

    padding: 60px 20px;

    color: #777777;
}

.empty-icon {
    margin-bottom: 8px;

    font-size: 42px;
}


/* =====================================================
   AYARLAR
===================================================== */

.settings {
    margin-top: 20px;

    padding: 20px;

    background: var(--black);

    color: white;

    border-radius: 14px;
}

.settings-title {
    margin-bottom: 18px;

    color: var(--yellow);

    font-size: 17px;
    font-weight: 900;
}

.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.form-group {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.form-group label {
    color: #aaaaaa;

    font-size: 11px;
    font-weight: 800;
}

.settings input,
.settings select {
    background: #1c1c1c;

    color: white;

    border-color: #333333;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    display: none;

    position: fixed;

    z-index: 9999;

    inset: 0;

    padding: 20px;

    background: rgba(0,0,0,.78);

    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 600px;

    max-height: 92vh;

    overflow-y: auto;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.4);
}

.modal-header {
    padding: 18px 20px;

    background: var(--black);

    color: white;

    border-bottom: 4px solid var(--yellow);

    display: flex;

    align-items: center;
    justify-content: space-between;
}

.modal-header h2 {
    margin: 0;

    font-size: 19px;
}

.close {
    padding: 7px 10px;

    background: #222222;

    color: white;

    font-size: 17px;
}

.modal-body {
    padding: 20px;
}

.modal-form {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.full {
    grid-column: 1 / -1;
}

textarea {
    min-height: 100px;

    resize: vertical;
}

.modal-footer {
    padding: 0 20px 20px;

    display: flex;

    justify-content: flex-end;

    gap: 8px;
}


/* =====================================================
   =====================================================
   MOBİL TASARIM
   =====================================================
   ===================================================== */

@media (max-width: 700px) {

    body {
        width: 100%;

        overflow-x: hidden;

        background: #eeeeee;
    }

    /* HEADER */

    header {
        width: 100%;
    }

    .header-inner {
        width: 100%;

        min-height: auto;

        padding: 17px 12px;

        flex-direction: column;

        justify-content: center;

        text-align: center;

        gap: 8px;
    }

    .logo {
        width: 220px;

        max-width: 70vw;
    }

    .clock-box {
        text-align: center;
    }

    .clock {
        font-size: 20px;
    }

    .date-clock {
        font-size: 12px;
    }

    .timezone {
        font-size: 10px;
    }


    /* ANA ALAN */

    .container {
        width: 100%;

        max-width: none;

        margin: 12px 0;

        padding: 0 9px;
    }


    /* TOOLBAR */

    .toolbar {
        width: 100%;

        padding: 10px;

        border-radius: 11px;

        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 9px;
    }

    .date-area {
        width: 100%;

        display: flex;

        gap: 5px;
    }

    .date-area input {
        min-width: 0;

        width: 100%;

        flex: 1;

        text-align: center;

        font-size: 13px;
    }

    .day-button {
        flex: 0 0 40px;

        width: 40px;
        height: 40px;
    }

    .toolbar > .btn-yellow {
        width: 100%;

        min-height: 43px;

        font-size: 13px;
    }


    /* İSTATİSTİK */

    .stats {
        width: 100%;

        grid-template-columns: 1fr 1fr;

        gap: 8px;

        margin: 10px 0;
    }

    .stat {
        width: 100%;

        padding: 12px;

        border-radius: 10px;
    }

    .stat::before {
        width: 3px;
    }

    .stat-title {
        font-size: 9px;

        white-space: nowrap;
    }

    .stat-value {
        margin-top: 2px;

        font-size: 22px;
    }


    /* =================================================
       TABLO KAPANIYOR
       MOBİLDE TABLO YERİNE KART
    ================================================= */

    .table-wrapper {
        width: 100%;

        overflow: visible;

        background: transparent;

        box-shadow: none;

        border-radius: 0;
    }

    table {
        display: block;

        width: 100%;

        min-width: 0;

        border: 0;
    }

    thead {
        display: none;
    }

    tbody {
        display: block;

        width: 100%;
    }


    /* =================================================
       RANDEVU KARTI
    ================================================= */

    tbody tr {
        display: grid;

        width: 100%;

        min-width: 0;

        margin: 0 0 10px 0;

        padding: 13px;

        background: white;

        border: 1px solid #e5e5e5;

        border-radius: 12px;

        box-shadow:
            0 3px 10px rgba(0,0,0,.07);

        grid-template-columns:
            minmax(0, 1fr)
            auto;

        grid-template-areas:

            "time status"

            "company company"

            "brand brand"

            "note note"

            "actions actions";
    }

    tbody tr:hover td {
        background: transparent !important;
    }


    /* TÜM HÜCRELERİ RESETLE */

    tbody td {
        display: block;

        width: 100%;

        min-width: 0;

        padding: 0;

        border: 0;

        background: transparent !important;

        overflow-wrap: anywhere;
    }


    /* SAAT */

    tbody td:nth-child(1) {
        grid-area: time;

        align-self: center;
    }

    .time {
        font-size: 25px;

        line-height: 1;

        color: #111111;
    }


    /* DURUM */

    tbody td:nth-child(4) {
        grid-area: status;

        width: auto;

        display: flex;

        justify-content: flex-end;

        align-items: center;
    }

    .status {
        max-width: 130px;

        padding: 6px 8px;

        font-size: 9px;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    /* FİRMA */

    tbody td:nth-child(2) {
        grid-area: company;

        margin-top: 11px;

        padding-top: 10px;

        border-top: 1px solid #eeeeee;
    }

    .company-name {
        width: 100%;

        font-size: 17px;

        line-height: 1.2;

        font-weight: 900;

        overflow-wrap: anywhere;
    }


    /* MARKA */

    tbody td:nth-child(3) {
        grid-area: brand;

        margin-top: 7px;
    }

    .brand {
        max-width: 100%;

        padding: 5px 8px;

        font-size: 11px;

        overflow-wrap: anywhere;
    }


    /* NOT */

    tbody td:nth-child(5) {
        grid-area: note;

        margin-top: 8px;

        color: #666666;

        font-size: 11px;

        line-height: 1.35;

        overflow-wrap: anywhere;
    }


    /* İŞLEMLER */

    tbody td:nth-child(6) {
        grid-area: actions;

        margin-top: 11px;

        padding-top: 10px;

        border-top: 1px solid #eeeeee;
    }

    .actions {
        width: 100%;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 7px;
    }

    .actions button {
        width: 100%;

        padding: 9px;

        font-size: 12px;
    }


    /* SIRADAKİ RANDEVU */

    .next-appointment {
        border: 2px solid var(--yellow);
    }

    .next-appointment td {
        border: 0 !important;
    }

    .next-badge {
        display: block;

        width: fit-content;

        margin-top: 5px;

        padding: 3px 5px;

        font-size: 8px;
    }


    /* BOŞ EKRAN */

    .empty {
        display: block;

        width: 100%;

        padding: 45px 12px;

        background: white;

        border-radius: 12px;
    }


    /* AYARLAR */

    .settings {
        width: 100%;

        margin-top: 14px;

        padding: 15px;

        border-radius: 12px;
    }

    .settings-title {
        font-size: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;

        gap: 11px;
    }


    /* MODAL */

    .modal {
        padding: 8px;
    }

    .modal-box {
        width: 100%;

        max-width: none;

        max-height: 96vh;

        border-radius: 13px;
    }

    .modal-header {
        padding: 15px;
    }

    .modal-header h2 {
        font-size: 16px;
    }

    .modal-body {
        padding: 15px;
    }

    .modal-form {
        grid-template-columns: 1fr;

        gap: 11px;
    }

    .full {
        grid-column: auto;
    }

    .modal-footer {
        padding: 0 15px 15px;

        display: grid;

        grid-template-columns: 1fr 1fr;
    }

    .modal-footer button {
        width: 100%;
    }

}


/* =====================================================
   ÇOK KÜÇÜK TELEFONLAR
===================================================== */

@media (max-width: 380px) {

    .container {
        padding: 0 7px;
    }

    .logo {
        width: 200px;
    }

    .clock {
        font-size: 18px;
    }

    .stat {
        padding: 10px;
    }

    .stat-title {
        font-size: 8px;
    }

    .stat-value {
        font-size: 20px;
    }

    tbody tr {
        padding: 11px;
    }

    .time {
        font-size: 23px;
    }

    .company-name {
        font-size: 16px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-inner">

        <img
            src="logo.png"
            class="logo"
            alt="STUDIO PARS">

        <div class="clock-box">

            <div
                class="clock"
                id="clock">
                --:--:--
            </div>

            <div
                class="date-clock"
                id="dateClock">
                --
            </div>

            <div
                class="timezone"
                id="timezoneText">
                Europe/Istanbul
            </div>

        </div>

    </div>

</header>


<!-- =====================================================
     ANA
===================================================== -->

<main class="container">


    <!-- TARİH + YENİ RANDEVU -->

    <section class="toolbar">

        <div class="date-area">

            <button
                class="day-button"
                onclick="changeDay(-1)">
                ‹
            </button>

            <input
                type="date"
                id="datePicker"
                onchange="render()">

            <button
                class="day-button"
                onclick="changeDay(1)">
                ›
            </button>

        </div>


        <button
            class="btn-yellow"
            onclick="openModal()">

            ＋ YENİ RANDEVU

        </button>

    </section>


    <!-- İSTATİSTİKLER -->

    <section class="stats">

        <div class="stat">

            <div class="stat-title">
                BUGÜNÜN RANDEVULARI
            </div>

            <div
                class="stat-value"
                id="totalCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                BEKLEYEN
            </div>

            <div
                class="stat-value"
                id="waitingCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                İŞLEMDE
            </div>

            <div
                class="stat-value"
                id="progressCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                TAMAMLANAN
            </div>

            <div
                class="stat-value"
                id="completedCount">
                0
            </div>

        </div>

    </section>


    <!-- =================================================
         RANDEVULAR
    ================================================== -->

    <section class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>SAAT</th>

                    <th>FİRMA</th>

                    <th>MARKA</th>

                    <th>DURUM</th>

                    <th>NOT</th>

                    <th>İŞLEMLER</th>

                </tr>

            </thead>


            <tbody id="appointmentTable"></tbody>

        </table>

    </section>


    <!-- =================================================
         AYARLAR
    ================================================== -->

    <section class="settings">

        <div class="settings-title">
            ⚙️ SİSTEM AYARLARI
        </div>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    FİRMA / İŞLETME ADI
                </label>

                <input
                    id="companyInput"
                    value="STUDIO PARS">

            </div>


            <div class="form-group">

                <label>
                    SAAT DİLİMİ
                </label>

                <select id="timezoneInput">

                    <option value="Europe/Istanbul">
                        Türkiye — Europe/Istanbul
                    </option>

                    <option value="Europe/Berlin">
                        Almanya — Europe/Berlin
                    </option>

                    <option value="Europe/London">
                        İngiltere — Europe/London
                    </option>

                    <option value="Europe/Paris">
                        Fransa — Europe/Paris
                    </option>

                    <option value="Asia/Dubai">
                        Dubai — Asia/Dubai
                    </option>

                </select>

            </div>

        </div>


        <br>


        <button
            class="btn-yellow"
            onclick="saveSettings()">

            AYARLARI KAYDET

        </button>

    </section>

</main>


<!-- =====================================================
     RANDEVU MODAL
===================================================== -->

<div
    class="modal"
    id="appointmentModal">


    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Yeni Randevu
            </h2>


            <button
                class="close"
                onclick="closeModal()">

                ✕

            </button>

        </div>


        <div class="modal-body">


            <div class="modal-form">


                <div class="form-group">

                    <label>
                        Tarih *
                    </label>

                    <input
                        type="date"
                        id="appointmentDate">

                </div>


                <div class="form-group">

                    <label>
                        Saat *
                    </label>

                    <input
                        type="time"
                        id="appointmentTime">

                </div>


                <div class="form-group full">

                    <label>
                        Firma Adı *
                    </label>

                    <input
                        type="text"
                        id="appointmentCompany"
                        placeholder="Örn: ABC Otomotiv">

                </div>


                <div class="form-group">

                    <label>
                        Marka
                    </label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="Örn: BMW">

                </div>


                <div class="form-group">

                    <label>
                        Durum
                    </label>

                    <select id="status">

                        <option value="waiting">
                            🟢 Bekliyor
                        </option>

                        <option value="progress">
                            🟡 İşlemde
                        </option>

                        <option value="completed">
                            🔵 Tamamlandı
                        </option>

                        <option value="cancelled">
                            🔴 İptal
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Not
                    </label>

                    <textarea
                        id="note"
                        placeholder="Randevu hakkında not..."></textarea>

                </div>

            </div>

        </div>


        <div class="modal-footer">

            <button
                class="btn-black"
                onclick="closeModal()">

                VAZGEÇ

            </button>


            <button
                class="btn-yellow"
                onclick="saveAppointment()">

                KAYDET

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   VERİLER
===================================================== */

let appointments =
    JSON.parse(
        localStorage.getItem(
            "studioParsAppointments"
        )
    ) || [];


let editingId = null;


let settings =
    JSON.parse(
        localStorage.getItem(
            "studioParsSettings"
        )
    ) || {

        company: "STUDIO PARS",

        timezone: "Europe/Istanbul"

    };


/* =====================================================
   BUGÜN
===================================================== */

function getToday() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                settings.timezone
        }
    ).format(
        new Date()
    );

}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

document.getElementById(
    "datePicker"
).value = getToday();


document.getElementById(
    "companyInput"
).value =
    settings.company;


document.getElementById(
    "timezoneInput"
).value =
    settings.timezone;


document.getElementById(
    "timezoneText"
).textContent =
    settings.timezone;


/* =====================================================
   RANDEVULARI GÖSTER
===================================================== */

function render() {

    const selectedDate =
        document.getElementById(
            "datePicker"
        ).value;


    const list =
        appointments
            .filter(
                appointment =>
                    appointment.date ===
                    selectedDate
            )
            .sort(
                (a,b) =>
                    a.time.localeCompare(
                        b.time
                    )
            );


    const table =
        document.getElementById(
            "appointmentTable"
        );


    table.innerHTML = "";


    if (list.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    <div class="empty-icon">
                        📅
                    </div>

                    <strong>
                        Bu gün için randevu yok
                    </strong>

                    <br><br>

                    <small>
                        Yeni randevu eklemek için
                        yukarıdaki butonu kullanın.
                    </small>

                </td>

            </tr>

        `;

        updateStats(list);

        return;

    }


    const now = new Date();


    const currentDate =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    settings.timezone
            }
        ).format(now);


    const currentTime =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone:
                    settings.timezone,

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false
            }
        ).format(now);


    let nextFound = false;


    list.forEach(
        appointment => {

            let isNext = false;


            if (
                !nextFound &&
                selectedDate === currentDate &&
                appointment.time >= currentTime &&
                appointment.status !== "completed" &&
                appointment.status !== "cancelled"
            ) {

                isNext = true;

                nextFound = true;

            }


            const statusText = {

                waiting:
                    "🟢 Bekliyor",

                progress:
                    "🟡 İşlemde",

                completed:
                    "🔵 Tamamlandı",

                cancelled:
                    "🔴 İptal"

            };


            const row =
                document.createElement(
                    "tr"
                );


            if (isNext) {

                row.classList.add(
                    "next-appointment"
                );

            }


            row.innerHTML = `

                <td>

                    <div class="time">
                        ${escapeHtml(appointment.time)}
                    </div>

                    ${
                        isNext
                        ? `
                            <span class="next-badge">
                                ★ SIRADAKİ
                            </span>
                          `
                        : ""
                    }

                </td>


                <td>

                    <div class="company-name">
                        ${escapeHtml(appointment.company)}
                    </div>

                </td>


                <td>

                    ${
                        appointment.brand

                        ? `
                            <span class="brand">
                                ${escapeHtml(appointment.brand)}
                            </span>
                          `

                        : `<span style="color:#aaa">—</span>`
                    }

                </td>


                <td>

                    <span
                        class="status ${appointment.status}">

                        ${statusText[appointment.status]}

                    </span>

                </td>


                <td>

                    ${
                        appointment.note

                        ? escapeHtml(appointment.note)

                        : `<span style="color:#aaa">—</span>`
                    }

                </td>


                <td>

                    <div class="actions">

                        <button
                            class="btn-edit"
                            onclick="editAppointment('${appointment.id}')">

                            ✏️

                        </button>


                        <button
                            class="btn-delete"
                            onclick="deleteAppointment('${appointment.id}')">

                            🗑️

                        </button>

                    </div>

                </td>

            `;


            table.appendChild(row);

        }
    );


    updateStats(list);

}


/* =====================================================
   İSTATİSTİK
===================================================== */

function updateStats(list) {

    document.getElementById(
        "totalCount"
    ).textContent =
        list.length;


    document.getElementById(
        "waitingCount"
    ).textContent =
        list.filter(
            x =>
                x.status ===
                "waiting"
        ).length;


    document.getElementById(
        "progressCount"
    ).textContent =
        list.filter(
            x =>
                x.status ===
                "progress"
        ).length;


    document.getElementById(
        "completedCount"
    ).textContent =
        list.filter(
            x =>
                x.status ===
                "completed"
        ).length;

}


/* =====================================================
   MODAL AÇ
===================================================== */

function openModal() {

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Yeni Randevu";


    document.getElementById(
        "appointmentDate"
    ).value =
        document.getElementById(
            "datePicker"
        ).value;


    document.getElementById(
        "appointmentTime"
    ).value =
        "";


    document.getElementById(
        "appointmentCompany"
    ).value =
        "";


    document.getElementById(
        "brand"
    ).value =
        "";


    document.getElementById(
        "status"
    ).value =
        "waiting";


    document.getElementById(
        "note"
    ).value =
        "";


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "active"
    );

}


/* =====================================================
   MODAL KAPAT
===================================================== */

function closeModal() {

    document.getElementById(
        "appointmentModal"
    ).classList.remove(
        "active"
    );

}


/* =====================================================
   RANDEVU KAYDET
===================================================== */

function saveAppointment() {

    const date =
        document.getElementById(
            "appointmentDate"
        ).value;


    const time =
        document.getElementById(
            "appointmentTime"
        ).value;


    const company =
        document.getElementById(
            "appointmentCompany"
        ).value.trim();


    if (
        !date ||
        !time ||
        !company
    ) {

        alert(
            "Tarih, saat ve firma adı zorunludur."
        );

        return;

    }


    const duplicate =
        appointments.some(
            appointment =>
                appointment.date === date &&
                appointment.time === time &&
                appointment.id !== editingId
        );


    if (duplicate) {

        if (
            !confirm(
                "⚠️ Bu saatte zaten bir randevu var.\n\nYine de kaydetmek istiyor musunuz?"
            )
        ) {

            return;

        }

    }


    const appointment = {

        id:
            editingId ||
            Date.now().toString(),

        date:
            date,

        time:
            time,

        company:
            company,

        brand:
            document.getElementById(
                "brand"
            ).value.trim(),

        status:
            document.getElementById(
                "status"
            ).value,

        note:
            document.getElementById(
                "note"
            ).value.trim()

    };


    if (editingId) {

        const index =
            appointments.findIndex(
                x =>
                    x.id ===
                    editingId
            );


        if (index !== -1) {

            appointments[index] =
                appointment;

        }

    }

    else {

        appointments.push(
            appointment
        );

    }


    localStorage.setItem(
        "studioParsAppointments",
        JSON.stringify(
            appointments
        )
    );


    document.getElementById(
        "datePicker"
    ).value =
        date;


    closeModal();

    render();

}


/* =====================================================
   DÜZENLE
===================================================== */

function editAppointment(id) {

    const appointment =
        appointments.find(
            x =>
                x.id === id
        );


    if (!appointment) {
        return;
    }


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Randevuyu Düzenle";


    document.getElementById(
        "appointmentDate"
    ).value =
        appointment.date;


    document.getElementById(
        "appointmentTime"
    ).value =
        appointment.time;


    document.getElementById(
        "appointmentCompany"
    ).value =
        appointment.company;


    document.getElementById(
        "brand"
    ).value =
        appointment.brand || "";


    document.getElementById(
        "status"
    ).value =
        appointment.status;


    document.getElementById(
        "note"
    ).value =
        appointment.note || "";


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "active"
    );

}


/* =====================================================
   SİL
===================================================== */

function deleteAppointment(id) {

    const appointment =
        appointments.find(
            x =>
                x.id === id
        );


    if (!appointment) {
        return;
    }


    if (
        !confirm(
            "Bu randevuyu silmek istediğinize emin misiniz?\n\n" +
            appointment.time +
            " - " +
            appointment.company
        )
    ) {

        return;

    }


    appointments =
        appointments.filter(
            x =>
                x.id !== id
        );


    localStorage.setItem(
        "studioParsAppointments",
        JSON.stringify(
            appointments
        )
    );


    render();

}


/* =====================================================
   GÜN DEĞİŞTİR
===================================================== */

function changeDay(amount) {

    const input =
        document.getElementById(
            "datePicker"
        );


    const date =
        new Date(
            input.value +
            "T12:00:00"
        );


    date.setDate(
        date.getDate() +
        amount
    );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    input.value =
        `${year}-${month}-${day}`;


    render();

}


/* =====================================================
   AYARLAR
===================================================== */

function saveSettings() {

    settings.company =
        document.getElementById(
            "companyInput"
        ).value.trim()
        ||
        "STUDIO PARS";


    settings.timezone =
        document.getElementById(
            "timezoneInput"
        ).value;


    localStorage.setItem(
        "studioParsSettings",
        JSON.stringify(
            settings
        )
    );


    document.getElementById(
        "timezoneText"
    ).textContent =
        settings.timezone;


    alert(
        "Ayarlar kaydedildi."
    );


    render();

    updateClock();

}


/* =====================================================
   SAAT
===================================================== */

function updateClock() {

    const now =
        new Date();


    const time =
        new Intl.DateTimeFormat(
            "tr-TR",
            {

                timeZone:
                    settings.timezone,

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }
        ).format(now);


    const date =
        new Intl.DateTimeFormat(
            "tr-TR",
            {

                timeZone:
                    settings.timezone,

                weekday:
                    "long",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }
        ).format(now);


    document.getElementById(
        "clock"
    ).textContent =
        time;


    document.getElementById(
        "dateClock"
    ).textContent =
        date;


    document.getElementById(
        "timezoneText"
    ).textContent =
        settings.timezone;

}


/* =====================================================
   GÜVENLİ METİN
===================================================== */

function escapeHtml(value) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   BAŞLAT
===================================================== */

render();

updateClock();


setInterval(
    updateClock,
    1000
);


setInterval(
    render,
    30000
);


/* =====================================================
   MODAL DIŞINA TIKLAYINCA KAPAT
===================================================== */

document.getElementById(
    "appointmentModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            this
        ) {

            closeModal();

        }

    }
);

</script>

</body>
</html>
